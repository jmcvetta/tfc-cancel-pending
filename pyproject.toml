[project]
name = "tfc-cancel-pending"
version = "0.1.0"
description = "Cancel pending runs in a Terraform Cloud workspace"
authors = [{name = "Jason McVetta", email = "jmcvetta@hey.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "terrasnek>=0.1.12",
    "structlog>=22.3.0",
    "environs>=9.5.0",
    "click>=8.1.3",
]

[tool.uv]
dev-dependencies = [
    "ipython>=8.11.0",
]

[tool.hatch.build.targets.wheel]
include = ["tfc-cancel-pending.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
